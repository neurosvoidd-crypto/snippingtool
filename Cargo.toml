[package]
name = "snipstudio"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
screenshots = "0.8"
rfd = "0.15"
arboard = "3.4"
flate2 = "1.0"

[build-dependencies]
flate2 = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
